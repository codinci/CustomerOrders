# gqlgen configuration. Regenerate with: go generate ./internal/graph/...
# Docs: https://gqlgen.com/config/

# Where are all the schema files located? Globs are supported, e.g. src/**/*.graphqls.
schema:
  - internal/graph/*.graphqls

# Where should the generated server code go?
exec:
  package: graph
  layout: single-file
  filename: internal/graph/generated.go

# Where should any generated models go?
model:
  filename: internal/graph/model/models_gen.go
  package: model

# Where should the resolver implementations go?
resolver:
  package: graph
  layout: follow-schema
  dir: internal/graph
  filename_template: "{name}.resolvers.go"

# Do not generate struct fields for resolver-backed relations (Customer.orders,
# Order.customer). They are loaded by field resolvers, so the models stay
# free of cyclic pointers.
omit_resolver_fields: true

# Pass directive arguments through even when the value is null.
call_argument_directives_with_null: true

# gqlgen searches these packages for types whose names match the schema.
# Keep empty so every model is generated from the schema.
autobind:

# Scalar and type mappings.
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  # RFC 3339 timestamps, handled by gqlgen.
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  # Exact money type; see internal/graph/scalar/decimal.go.
  Decimal:
    model:
      - github.com/codinci/customerorders/internal/graph/scalar.Decimal
  # The GraphQL Int type is a signed 32-bit integer.
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int32
  Customer:
    fields:
      orders:
        resolver: true
  Order:
    fields:
      customer:
        resolver: true
